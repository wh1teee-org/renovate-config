name: Validate Renovate presets

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0

      - name: Verify fleet policy invariants
        run: node scripts/test-presets.mjs

      - name: Verify JIT runner smoke policy
        run: node scripts/test-jit-runner-smoke.mjs

      - name: Verify effective fixture policy
        run: node scripts/test-renovate-fixture.mjs
        env:
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}

      - name: Validate Renovate configuration
        run: >-
          npm exec --yes --package=renovate@43.269.1 --
          renovate-config-validator --strict --no-global
          default.json node.json pnpm.json konergy.json athleteos.json
